name: Validate participant kit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild public sources
        run: |
          python3 scripts/build_notebook.py
          python3 scripts/build_site.py
      - name: Verify data, installer and distribution
        run: python3 -m unittest discover -s tests -v
      - name: Check generated text is current
        run: git diff --exit-code -- notebooks/ data/bundle.json site/ ':!site/data/workshop.sqlite'
